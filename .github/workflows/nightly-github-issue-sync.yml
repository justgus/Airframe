name: Nightly GitHub Issue Sync

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync-github-issues:
    name: Import unassigned GitHub Issues
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import unassigned GitHub Issues
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/import-github-issues.sh

      - name: Commit synchronized issue docs
        run: |
          if git diff --quiet; then
            echo "No issue documentation changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/Issues docs/GitHub-Issue-Mapping.md
          git commit -m "Sync GitHub issues into Airframe backlog"
          git push
